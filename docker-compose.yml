version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: algolens-postgres
    environment:
      POSTGRES_USER: algolens
      POSTGRES_PASSWORD: algolens_dev
      POSTGRES_DB: algolens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algolens"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: algolens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: algolens-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://algolens:algolens_dev@postgres:5432/algolens
      - REDIS_URL=redis://redis:6379/0
      - EXECUTION_ENGINE_URL=http://execution-engine:8001
      - AI_SERVICE_URL=http://ai-service:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Execution Engine
  execution-engine:
    build:
      context: ./execution-engine
      dockerfile: ../infrastructure/docker/execution-engine.Dockerfile
    container_name: algolens-execution-engine
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
    volumes:
      - ./execution-engine:/app
    command: python -m src.main

  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../infrastructure/docker/ai-service.Dockerfile
    container_name: algolens-ai-service
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379/2
      - OPENAI_API_KEY=\
      - PINECONE_API_KEY=\
    depends_on:
      - redis
    volumes:
      - ./ai-service:/app
    command: python -m src.main

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: algolens-celery-worker
    environment:
      - DATABASE_URL=postgresql://algolens:algolens_dev@postgres:5432/algolens
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app worker --loglevel=info

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: algolens-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
